<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Client Login</h3>
        <form method="POST">
            <div class="mb-3">
                <label>License Key</label>
                <input type="text" name="license_key" class="form-control" placeholder="ISS-XXXXXXXX" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Access Portal</button>
        </form>
    </div>
</body>
</html>
